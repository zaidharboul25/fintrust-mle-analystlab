services:
  fintrust-api:
    image: zaidharboul25/fintrust-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fintrust-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
